version: '3.8'

services:
  # Backend API Gateway
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
      target: backend
    image: mental-health-chatbot-backend:latest
    container_name: mental-health-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///chatbot.db}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Gradio
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: mental-health-chatbot-frontend:latest
    container_name: mental-health-frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Inference Test Service (GPU support)
  inference-test:
    build:
      context: .
      dockerfile: Dockerfile.inference
    image: mental-health-chatbot-inference:latest
    container_name: mental-health-inference
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; print('CUDA available:', torch.cuda.is_available())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # PyTorch Development Environment
  pytorch-dev:
    build:
      context: .
      dockerfile: Dockerfile.pytorch
    image: mental-health-chatbot-pytorch:latest
    container_name: mental-health-pytorch
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./:/app
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  logs: 