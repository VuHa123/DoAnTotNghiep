version: '3.8'

services:
  # Backend API Gateway
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///chatbot.db}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Gradio
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./logs:/app/logs

volumes:
  logs: 