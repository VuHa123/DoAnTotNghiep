<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Tâm Lý</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f7f7f8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #chat-box {
      width: 100%;
      max-width: 800px;
      height: 80vh;
      margin: 0 auto;
      background: #fff;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }

    .message {
      padding: 16px 24px;
      position: relative;
      line-height: 1.5;
    }

    .user {
      background: #f7f7f8;
    }

    .bot {
      background: #ffffff;
    }

    .message-content {
      max-width: 700px;
      margin: 0 auto;
    }

    .typing-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #999;
      border-radius: 50%;
      margin-left: 4px;
      animation: typing 1s infinite;
    }

    .typing-indicator:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }

    #input-area {
      width: 100%;
      max-width: 800px;
      display: flex;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e5e5e6;
      position: sticky;
      bottom: 0;
    }

    #prompt {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #e5e5e6;
      border-radius: 8px;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    #prompt:focus {
      border-color: #10a37f;
    }

    #send-btn {
      padding: 12px 24px;
      font-size: 16px;
      margin-left: 12px;
      background: #10a37f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover {
      background: #0d8e6f;
    }

    pre {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
    }

    code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 14px;
    }

    blockquote {
      border-left: 4px solid #e5e5e6;
      padding-left: 16px;
      margin-left: 0;
      color: #666;
    }
  </style>
</head>
<body>

  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="prompt" placeholder="Nhập câu hỏi tâm lý..." />
    <button id="send-btn">Gửi</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script>
    const apiUrl = "https://publishers-fabrics-businesses-sb.trycloudflare.com/model/generate/";
    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");

    // Configure marked
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      breaks: true,
      gfm: true
    });

    function createMessage(role, content) {
      const message = document.createElement('div');
      message.className = `message ${role}`;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      if (role === 'user') {
        contentDiv.innerHTML = marked.parse(content);
      } else {
        contentDiv.innerHTML = content;
      }
      
      message.appendChild(contentDiv);
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;
      return contentDiv;
    }

    function showTypingIndicator() {
      const indicator = document.createElement('div');
      indicator.className = 'message bot';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = '<span class="typing-indicator"></span><span class="typing-indicator"></span><span class="typing-indicator"></span>';
      
      indicator.appendChild(contentDiv);
      chatBox.appendChild(indicator);
      chatBox.scrollTop = chatBox.scrollHeight;
      return indicator;
    }

    sendBtn.addEventListener("click", async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      // Show user message
      createMessage('user', prompt);

      // Show typing indicator
      const typingIndicator = showTypingIndicator();

      // Reset input
      promptInput.value = "";

      try {
        // Create bot message container
        typingIndicator.remove();
        const botMsg = createMessage('bot', '');
        
        // Fetch streaming response
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: prompt,
            max_new_tokens: 1024
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const text = decoder.decode(value);
          fullResponse += text;
          
          // Update with parsed markdown
          botMsg.innerHTML = marked.parse(fullResponse);
          chatBox.scrollTop = chatBox.scrollHeight;
          
          // Highlight code blocks
          document.querySelectorAll('pre code').forEach(hljs.highlightElement);
        }
      } catch (error) {
        createMessage('bot', '**Lỗi:** Không thể kết nối với máy chủ. Vui lòng thử lại sau.');
        console.error(error);
      }
    });

    // Send on Enter (but allow Shift+Enter for new lines)
    promptInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
  </script>

</body>
</html>
