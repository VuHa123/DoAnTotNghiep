<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Tâm Lý</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #89f7fe, #66a6ff);
      margin: 0;
      padding: 0;
    }

    #chat-container {
      max-width: 600px;
      margin: 60px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      background-color: #4a90e2;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      padding: 20px;
      background-color: #f9f9f9;
    }

    .message {
      margin: 10px 0;
      line-height: 1.5;
    }

    .user {
      text-align: right;
      color: #333;
    }

    .bot {
      text-align: left;
      color: #2b7a78;
      font-style: italic;
    }

    #input-container {
      display: flex;
      padding: 16px;
      border-top: 1px solid #ddd;
      background-color: #fff;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #send-btn {
      margin-left: 10px;
      padding: 10px 20px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #send-btn:hover {
      background-color: #357ABD;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="header">💬 Chatbot Tâm Lý</div>
  <div id="messages"></div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="Nhập cảm xúc của bạn..." />
    <button id="send-btn">Gửi</button>
  </div>
</div>

<script>
  const messagesDiv = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  let history = [];

  function appendMessage(sender, text) {
    const msg = document.createElement('div');
    msg.className = `message ${sender}`;
    msg.textContent = (sender === 'user' ? "Bạn: " : "Bot: ") + text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  sendBtn.onclick = async function () {
    const input = userInput.value.trim();
    if (!input) return;

    appendMessage("user", input);
    userInput.value = '';
    history.push(input);

    try {
      const response = await fetch('http://localhost:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_input: input,
          history: history
        })
      });

      const data = await response.json();
      appendMessage("bot", data.bot_response);
    } catch (err) {
      appendMessage("bot", "⚠️ Lỗi kết nối đến server.");
    }
  };
</script>

</body>
</html>
